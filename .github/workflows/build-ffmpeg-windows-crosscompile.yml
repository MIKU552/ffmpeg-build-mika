name: FFmpeg Windows Cross-Compile

on:
  push:
    branches:
      - feature/cross-compile-windows # <--- 改成这个
  pull_request:
    branches:
      - feature/cross-compile-windows # <--- 改成这个

jobs:
  build-windows-x64:
    name: Build for Windows x86_64
    runs-on: ubuntu-24.04 # 依然使用极速的 Ubuntu 虚拟机
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies (MinGW-w64 & Wine)
        run: |
          sudo apt-get update
          # 保留基础构建工具，并加入 Windows 交叉编译两大神器：mingw-w64 和 wine64
          sudo apt-get install -y --no-install-recommends \
              build-essential gcc g++ binutils make cmake ninja-build pkg-config \
              curl wget patch tar gzip bzip2 xz-utils zip python3 python3-pip \
              python3-venv python3-virtualenv nasm git-lfs docbook-utils \
              xsltproc asciidoc xmlto gperf autopoint automake libtool autoconf \
              gettext liblzma-dev libnuma-dev libssl-dev ccache \
              mingw-w64 wine64
              
      - name: Setup Rust for Windows Target
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add x86_64-pc-windows-gnu

      - name: Cache cargo-c
        id: cache-cargo-c
        uses: actions/cache@v4
        with:
          # 提取 cargo-c 相关的二进制文件和底层依赖包缓存
          path: |
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
            ~/.cargo/bin/cargo-ctest
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # 缓存的 Key 绑定了系统和版本号，如果你以后升级 0.10.20，改这里的 Key 就会自动刷新缓存
          key: ${{ runner.os }}-cargo-c-0.10.20-

      - name: Install cargo-c (If not cached)
        if: steps.cache-cargo-c.outputs.cache-hit != 'true'
        run: |
          source "$HOME/.cargo/env"
          cargo install cargo-c --version 0.10.20 --locked

      - name: Build FFmpeg
        run: |
          source "$HOME/.cargo/env"
          # 我们预留一个 TARGET_OS=Windows 的参数，等下在任务 2 里去脚本里解析它
          # 先关闭打包和测试，专注于纯粹的编译
          ./build_fix.sh -SKIP_BUNDLE=YES -SKIP_TEST=YES -TARGET_OS=Windows

      - name: Upload Build Logs and Artifacts
        uses: actions/upload-artifact@v4
        if: always() # 核心：无论前面哪一步爆炸，这步都必须强制执行！
        with:
          name: windows-cross-compile-logs
          path: |
            log/*.log         # 抓取你脚本生成的全量模块日志 (最重要！)
            build/**/*.log    # 抓取 CMake 或底层的其他零散日志
            build/out/bin/*.exe
            build/out/bin/*.dll
          retention-days: 7   # 把保留时间延长到 7 天，方便你周末慢慢看