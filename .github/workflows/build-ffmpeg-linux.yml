name: FFmpeg Build CI

on: 
  push:
    branches: [ "MIX" ]
  pull_request:
    branches: [ "MIX" ]
  workflow_dispatch: 

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      # 1. 签出代码并拉取 LFS 文件
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 安装系统依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ binutils make cmake ninja-build pkg-config \
            curl wget patch tar gzip bzip2 xz-utils zip python3 python3-pip \
            python3-venv python3-virtualenv nasm git-lfs docbook-utils \
            xsltproc asciidoc xmlto gperf autopoint automake libtool autoconf \
            gettext liblzma-dev libnuma-dev libssl-dev ccache \
            libva-dev libvulkan-dev vulkan-utility-libraries-dev spirv-tools glslang-dev glslang-tools libshaderc-dev libdrm-dev

      # 3. 安装 Rust 工具链
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Cargo
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-

      # 5. 安装 cargo-c (利用缓存跳过重复安装)
      - name: Install cargo-c
        run: |
          if ! command -v cargo-cbuild &> /dev/null; then
            cargo install cargo-c --locked
          else
            echo "cargo-c is already installed from cache, skipping!"
          fi

      # 6. 【修改点】恢复 ccache 缓存 (只负责拉取)
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          # 加上 run_attempt 保证 key 绝对唯一，避免已存在冲突
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 7. 运行构建脚本
      - name: Run Build Script
        id: build_script
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 2G
          
          echo "==== ccache stats before build ===="
          ccache -s 
          echo "==================================="

          chmod +x build.sh build_fix.sh script/*.sh
          mkdir -p build && cd build
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES
          
          echo "==== ccache stats after build ===="
          ccache -s
          echo "=================================="

      # 8. 【修改点】保存 ccache 缓存 (只负责保存，且无论成功失败都执行)
      - name: Save ccache
        if: always() # 核心：即使上面的 Run Build Script 报错退出了，这一步也会强制执行
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}

      # 9. 上传构建成功的产物
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-gcc-build
          path: |
            build/ffmpeg-build*.tar.gz
            build/log/
          if-no-files-found: error

      # 10. 仅在构建失败时上传日志
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-on-failure-(ubuntu-24.04-gcc)
          path: build/log/
          if-no-files-found: ignore