name: FFmpeg Build CI

on: 
  push:
    branches: [ "MIX" ] # 监听 MIX 分支的 push
  pull_request:
    branches: [ "MIX" ] # 监听合并到 MIX 分支的 PR
  workflow_dispatch:    # 保持这个，方便你手动点击运行

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      # 1. 签出代码并拉取 LFS 文件
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 安装系统依赖 (补全了 README 中要求的依赖)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ binutils make cmake ninja-build pkg-config \
            curl wget patch tar gzip bzip2 xz-utils zip python3 python3-pip \
            python3-venv python3-virtualenv nasm git-lfs docbook-utils \
            xsltproc asciidoc xmlto gperf autopoint automake libtool autoconf \
            gettext liblzma-dev libnuma-dev libssl-dev

      # 3. 安装 Rust 工具链
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Cargo 注册表和构建文件 (显著加快 cargo-c 的安装)
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-

      # 5. 安装 cargo-c (用于 rav1e 依赖)
      - name: Install cargo-c
        run: cargo install cargo-c --locked

      # 6. 运行构建脚本 (在独立 build 目录中运行)
      - name: Run Build Script
        id: build_script
        run: |
          # 确保所有脚本都有执行权限
          chmod +x build.sh build_fix.sh script/*.sh
          
          # 创建并进入构建目录
          mkdir build
          cd build
          
          # 运行构建
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES

      # 7. 上传构建成功的产物
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-gcc-build
          path: |
            build/ffmpeg-build.tar.gz
            build/log/
          if-no-files-found: error

      # 8. 仅在构建失败时上传日志
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-on-failure-(ubuntu-24.04-gcc)
          path: build/log/
          if-no-files-found: ignore