name: FFmpeg Build CI

on: 
  push:
    branches: [ "MIX" ]
  pull_request:
    branches: [ "MIX" ]
  workflow_dispatch: # 允许手动在 Actions 页面触发构建

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      # 1. 签出代码并拉取 LFS 文件
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 安装系统依赖 (补全了 README 中要求的依赖，并加上了 ccache)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ binutils make cmake ninja-build pkg-config \
            curl wget patch tar gzip bzip2 xz-utils zip python3 python3-pip \
            python3-venv python3-virtualenv nasm git-lfs docbook-utils \
            xsltproc asciidoc xmlto gperf autopoint automake libtool autoconf \
            gettext liblzma-dev libnuma-dev libssl-dev ccache

      # 3. 安装 Rust 工具链
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Cargo 注册表和构建文件 (加快 cargo-c 的安装)
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-

      # 5. 安装 cargo-c (用于 rav1e 依赖)
      - name: Install cargo-c
        run: cargo install cargo-c --locked

      # 6. 配置 ccache 缓存 (核心提速魔法)
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # 使用 github.sha 保证每次 Push 都会把最新的缓存保存下来，下次恢复时用 restore-keys 模糊匹配最新的
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 7. 运行构建脚本 (在独立 build 目录中运行)
      - name: Run Build Script
        id: build_script
        run: |
          # 【魔法在这里】将 ccache 的目录加到 PATH 最前面，拦截 GCC
          export PATH="/usr/lib/ccache:$PATH"
          
          # 配置 ccache 最大使用 2GB 空间
          ccache -M 2G
          # 打印构建前的缓存统计信息 (可以在 Action 日志里查看)
          echo "==== ccache stats before build ===="
          ccache -s 
          echo "==================================="

          # 确保所有脚本都有执行权限
          chmod +x build.sh build_fix.sh script/*.sh
          
          # 创建并进入构建目录
          mkdir -p build
          cd build
          
          # 运行构建
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES
          
          # 打印构建后的缓存统计信息 (看看命中了多少缓存！)
          echo "==== ccache stats after build ===="
          ccache -s
          echo "=================================="

      # 8. 上传构建成功的产物
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-gcc-build
          path: |
            build/ffmpeg-build.tar.gz
            build/log/
          if-no-files-found: error

      # 9. 仅在构建失败时上传日志
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-on-failure-(ubuntu-24.04-gcc)
          path: build/log/
          if-no-files-found: ignore