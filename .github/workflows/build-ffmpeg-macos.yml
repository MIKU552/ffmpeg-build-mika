name: FFmpeg Build macOS CI

on: 
  push:
    branches: [ "MIXMACOSCI" ]
  pull_request:
    branches: [ "MIXMACOSCI" ]
  workflow_dispatch: 

jobs:
  build-macos:
    # 明确指定使用最新的 macOS 26 (Tahoe) 运行环境
    runs-on: macos-26
    env:
      CARGO_C_VERSION: "0.10.20"

    steps:
      # 1. 签出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. macOS 使用 Homebrew 安装系统依赖 (不包含 Linux 专属的 Vulkan/VAAPI)
      - name: Install System Dependencies
        run: |
          brew update
          brew install automake libtool cmake ninja nasm pkg-config ccache wget xz

      # 3. 安装 Rust 工具链
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Cargo
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-

      # 5. 安装 cargo-c (精确版本校验与防冲突)
      - name: Install cargo-c
        run: |
          set +e
          HAS_CARGO_C=$(command -v cargo-cbuild)
          if [ -n "$HAS_CARGO_C" ]; then
            CURRENT_VERSION=$(cargo cbuild --version 2>/dev/null)
            if [[ "$CURRENT_VERSION" == *"${{ env.CARGO_C_VERSION }}"* ]]; then
              echo "cargo-c v${{ env.CARGO_C_VERSION }} is already installed from cache, skipping!"
              SKIP_INSTALL="true"
            fi
          fi
          set -e
          
          if [ "$SKIP_INSTALL" != "true" ]; then
            echo "Installing/Updating cargo-c to v${{ env.CARGO_C_VERSION }}..."
            cargo install cargo-c --version ${{ env.CARGO_C_VERSION }} --locked --force
          fi

      # 6. 恢复 ccache 缓存 (macOS 路径为 ~/Library/Caches/ccache)
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 7. 运行构建脚本
      - name: Run Build Script
        id: build_script
        run: |
          # 挂载 homebrew 的 ccache
          export PATH="$(brew --prefix ccache)/libexec:$PATH"
          ccache -M 2G
          
          echo "==== ccache stats before build ===="
          ccache -s 
          echo "==================================="

          chmod +x build.sh build_fix.sh script/*.sh
          mkdir -p build && cd build
          
          # 运行编译，build_fix.sh 内部有判断 OS_NAME="Darwin" 的逻辑，自动处理 videotoolbox
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES
          
          echo "==== ccache stats after build ===="
          ccache -s
          echo "=================================="

      # 8. 保存 ccache 缓存
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}

      # 9. 上传产物以备不时之需
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-clang-build
          path: |
            build/ffmpeg-build*.zip
            build/log/
          if-no-files-found: error

      # 10. 仅在构建失败时上传日志
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-on-failure-(macos-26-clang)
          path: build/log/
          if-no-files-found: ignore

      # 11. 提取版本，重命名产物，并生成 Release Notes
      - name: Prepare Release
        if: success()
        run: |
          chmod -R 755 build/out/bin/
          
          # 【核心】macOS 中必须使用 DYLD_LIBRARY_PATH 来加载你刚刚编译出来的共享动态库
          export DYLD_LIBRARY_PATH="$(pwd)/build/out/lib:$(pwd)/build/out/lib64:$DYLD_LIBRARY_PATH"
          
          # 获取版本号并切除尾部赘述
          RAW_VERSION=$(./build/out/bin/ffmpeg -version | head -n1 | awk '{print $3}')
          FFMPEG_VERSION=$(echo "$RAW_VERSION" | sed 's/-MiKayule.*//')
          echo "FFMPEG_VERSION=$FFMPEG_VERSION" >> $GITHUB_ENV
          
          # macOS 的脚本打包产物是 .zip
          NEW_ZIP_NAME="ffmpeg-${FFMPEG_VERSION}-macos-arm64-clang.zip"
          mv build/ffmpeg-build*.zip "build/${NEW_ZIP_NAME}"
          echo "ZIP_NAME=${NEW_ZIP_NAME}" >> $GITHUB_ENV
          
          # 设定标准 ISO 8601 时区时间戳
          export TZ='Asia/Shanghai'
          CURRENT_TIME=$(date +'%Y-%m-%dT%H:%M:%S+08:00')
          
          NOTES_FILE="release_notes.md"
          
          # 写入中英双语 Release Notes
          echo "### ~~最新最热的 FFmpeg~~" > $NOTES_FILE
          echo "编译于 \`${CURRENT_TIME}\`。视频编码库均选用最新的 commit，其余库使用的则是最新的 release。" >> $NOTES_FILE
          echo "其中 x265, SVT-AV1, VVenC, VVdeC 编译开启了 LTO 优化和 PGO 优化，FFmpeg 开启了 LTO 优化。" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          echo "Compiled on \`${CURRENT_TIME}\`. Video encoding libraries use the latest commit, while other libraries use the latest release." >> $NOTES_FILE
          echo "x265, SVT-AV1, VVenC, and VVdeC are compiled with LTO and PGO enabled. FFmpeg is compiled with LTO enabled." >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          echo "### Compiled Component Versions" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          for f in $(ls version/* | sort); do
              if [ -f "$f" ]; then
                  comp=$(basename "$f")
                  if [ "$comp" = "ffmpeg" ]; then
                      continue
                  fi
                  ver=$(cat "$f")
                  echo "* **$comp**: \`$ver\`" >> $NOTES_FILE
              fi
          done
          
      # 12. 自动发布 macOS 版 GitHub Release 附件
      - name: Create Release and Upload Asset
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          # 加一个 -macos 后缀以防和 Linux 并行运行时出现 Git Tag 冲突
          tag_name: ${{ env.FFMPEG_VERSION }}-${{ github.run_number }}-macos
          name: FFmpeg macOS Build ${{ env.FFMPEG_VERSION }}
          body_path: release_notes.md
          files: build/${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}