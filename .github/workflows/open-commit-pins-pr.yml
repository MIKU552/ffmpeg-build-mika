name: Open Commit Pin PR

on:
  workflow_run:
    workflows: ["FFmpeg Multi-Platform CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

env:
  BASE_BRANCH: MIX
  UPDATE_BRANCH: auto/commit-pins

jobs:
  open-pr:
    name: Open PR for Validated Commit Pins
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'auto/commit-pins' }}

    steps:
      - name: Create or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          Automated codec commit pins were updated, built, and released successfully.

          Successful build workflow: $RUN_URL

          Review and merge this PR to sync the validated pins back into MIX.
          EOF

          EXISTING_PR="$(gh pr list \
            --repo "$REPO" \
            --head "$UPDATE_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --repo "$REPO" \
              --title "chore: sync validated codec commit pins" \
              --body-file "$BODY_FILE"
            echo "Updated pull request #$EXISTING_PR."
          else
            gh pr create \
              --repo "$REPO" \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore: sync validated codec commit pins" \
              --body-file "$BODY_FILE"
          fi
