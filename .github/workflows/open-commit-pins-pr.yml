name: Open Commit Pin PR

on:
  workflow_run:
    workflows: ["FFmpeg Multi-Platform CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  BASE_BRANCH: MIX
  UPDATE_BRANCH: auto/commit-pins

jobs:
  open-pr:
    name: Open PR for Validated Commit Pins
    runs-on: ubuntu-24.04

    steps:
      - name: Inspect Triggering Workflow
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          echo "Trigger context:"
          echo "  event name:  $EVENT_NAME"
          echo "  conclusion: $RUN_CONCLUSION"
          echo "  event:      $RUN_EVENT"
          echo "  branch:     $RUN_BRANCH"
          echo "  url:        $RUN_URL"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_open_pr=true" >> "$GITHUB_OUTPUT"
          elif [ "$RUN_CONCLUSION" = "success" ] && [ "$RUN_BRANCH" = "$UPDATE_BRANCH" ]; then
            echo "should_open_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_open_pr=false" >> "$GITHUB_OUTPUT"
            echo "This workflow run is not a successful build from $UPDATE_BRANCH; no PR will be opened."
          fi

      - name: Create or Update Pull Request
        if: ${{ steps.trigger.outputs.should_open_pr == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ steps.trigger.outputs.run_url }}
        run: |
          set -euo pipefail

          BODY_FILE="$(mktemp)"
          if [ -n "$RUN_URL" ]; then
            cat > "$BODY_FILE" <<EOF
          Automated codec commit pins were updated, built, and released successfully.

          Successful build workflow: $RUN_URL

          Review and merge this PR to sync the validated pins back into MIX.
          EOF
          else
            cat > "$BODY_FILE" <<EOF
          Automated codec commit pins are ready to sync back into MIX.

          Review and merge this PR after confirming the latest build completed successfully.
          EOF
          fi

          EXISTING_PR="$(gh pr list \
            --repo "$REPO" \
            --head "$UPDATE_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --repo "$REPO" \
              --title "chore: sync validated codec commit pins" \
              --body-file "$BODY_FILE"
            echo "Updated pull request #$EXISTING_PR."
          else
            gh pr create \
              --repo "$REPO" \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore: sync validated codec commit pins" \
              --body-file "$BODY_FILE"
          fi
