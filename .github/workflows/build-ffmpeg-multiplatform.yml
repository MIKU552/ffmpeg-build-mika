name: FFmpeg Multi-Platform CI

# ==============================================================================
# Triggers & Concurrency
# ==============================================================================
on:
  push:
    branches: [ "MIX" ]
  pull_request:
    branches: [ "MIX" ]
  workflow_dispatch:

# ==============================================================================
# Global Environment Variables
# ==============================================================================
env:
  CARGO_C_VERSION: "0.10.20"  # Global cargo-c version
  RUST_TOOLCHAIN: "stable"    # Rust toolchain version

jobs:

  # ============================================================================
  # Job 1: Linux Build Task (Ubuntu)
  # ============================================================================
  build-linux:
    name: Build Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    
    steps:
      # --- 1. Checkout Code ---
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # --- 2. Install Dependencies ---
      - name: Install System Dependencies
        run: |
          # Add LunarG Vulkan SDK keys
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          
          # Install packages
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ binutils make cmake ninja-build pkg-config \
            curl wget patch tar gzip bzip2 xz-utils zip python3 python3-pip \
            python3-venv python3-virtualenv nasm git-lfs docbook-utils \
            xsltproc asciidoc xmlto gperf autopoint automake libtool autoconf \
            gettext liblzma-dev libnuma-dev libssl-dev ccache \
            libva-dev libdrm-dev vulkan-sdk

      # --- 3. Rust Environment ---
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-

      - name: Install cargo-c
        run: |
          set +e
          SKIP_INSTALL="false"

          # Check if cargo-cbuild exists and matches version
          if command -v cargo-cbuild >/dev/null 2>&1; then
            CURRENT_VERSION=$(cargo cbuild --version 2>/dev/null)
            if [[ "$CURRENT_VERSION" == *"${{ env.CARGO_C_VERSION }}"* ]]; then
              echo "✅ cargo-c v${{ env.CARGO_C_VERSION }} is already installed."
              SKIP_INSTALL="true"
            fi
          fi
          set -e
          
          if [ "$SKIP_INSTALL" != "true" ]; then
            echo "🚀 Installing cargo-c v${{ env.CARGO_C_VERSION }}..."
            cargo install cargo-c --version ${{ env.CARGO_C_VERSION }} --locked --force
          fi

      # --- 4. CCache Setup ---
      - name: Restore CCache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # --- 5. Main Build Execution ---
      - name: Run Build Script
        run: |
          # Configure CCache
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 600M
          
          # Force CMake to use ccache
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          
          echo "==== CCache Status (Before) ===="
          ccache -s
          
          # Permission Fix & Execution
          chmod +x build.sh build_fix.sh script/*.sh
          mkdir -p build && cd build
          
          # Call the main build script
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES
          
          echo "==== CCache Status (After) ===="
          ccache -s

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}

      # --- 6. Verification & Artifact Prep ---
      - name: Generate Component Report
        if: success()
        run: |
          echo "### Verified Compiled Component Versions" > build/components.md
          echo "" >> build/components.md
          
          LIB_DIR="$(pwd)/build/tool/lib"
          
          # Helper function to check library existence
          check_lib() {
            local name=$1
            local version_file=$2
            local lib_pattern=$3
            
            # Fuzzy match using find to locate .a files
            if find "$LIB_DIR" -maxdepth 1 -name "$lib_pattern" -print -quit | grep -q .; then
               local ver=$(cat "$version_file" 2>/dev/null || echo "git-latest")
               
               # Handle git hashes (truncate if necessary)
               if [[ "$ver" =~ ^[0-9a-f]{7,40}$ ]]; then
                   ver="git-$(echo $ver | cut -c1-7)"
               fi
               
               echo "* **$name**: \`$ver\`" >> build/components.md
               echo "✅ Verified $name ($ver)"
            else
               echo "⚠️ Skipped $name"
            fi
          }

          # Iterate over version files in the repo
          for f in $(ls version/* | sort); do
              [ -f "$f" ] || continue
              comp=$(basename "$f")
              
              # Filter out build tools
              [[ "$comp" =~ ^(cmake|meson|ninja|nasm|yasm|cargo-c|pkg-config|ffmpeg)$ ]] && continue

              # Comprehensive mapping table for library names
              case "$comp" in
                  # Audio libraries
                  "fdk-aac")    PATTERN="libfdk-aac.a" ;;
                  "lame")       PATTERN="libmp3lame.a" ;;
                  "opus")       PATTERN="libopus.a" ;;
                  "vorbis")     PATTERN="libvorbis.a" ;;
                  "ogg")        PATTERN="libogg.a" ;;
                  "theora")     PATTERN="libtheora.a" ;;
                  "soxr")       PATTERN="libsoxr.a" ;;
                  
                  # Video libraries
                  "x264")       PATTERN="libx264.a" ;;
                  "x265"*)      PATTERN="libx265.a" ;;
                  "aom")        PATTERN="libaom.a" ;;
                  "dav1d")      PATTERN="libdav1d.a" ;;
                  "rav1e")      PATTERN="librav1e.a" ;;
                  "svt-av1")    PATTERN="libSvtAv1Enc.a" ;;
                  "vpx")        PATTERN="libvpx.a" ;;
                  "vvenc")      PATTERN="libvvenc.a" ;;
                  "vvdec")      PATTERN="libvvdec.a" ;;
                  "openh264")   PATTERN="libopenh264.a" ;;
                  "openjpeg")   PATTERN="libopenjp2.a" ;;
                  "webp")       PATTERN="libwebp.a" ;;
                  
                  # Filters & Effects
                  "zimg")       PATTERN="libzimg.a" ;;
                  "vmaf"*)      PATTERN="libvmaf.a" ;;
                  "libass")     PATTERN="libass.a" ;;
                  "freetype")   PATTERN="libfreetype.a" ;;
                  "fribidi")    PATTERN="libfribidi.a" ;;
                  "fontconfig") PATTERN="libfontconfig.a" ;;
                  "harfbuzz")   PATTERN="libharfbuzz.a" ;;
                  "zvbi")       PATTERN="libzvbi.a" ;;
                  "libklvanc")  PATTERN="libklvanc.a" ;;
                  
                  # Base/Transport libraries
                  "zlib")       PATTERN="libz.a" ;;
                  "openssl")    PATTERN="libssl.a" ;;
                  "sdl")        PATTERN="libSDL2.a" ;;
                  "xml2")       PATTERN="libxml2.a" ;;
                  "srt")        PATTERN="libsrt.a" ;;
                  "snappy")     PATTERN="libsnappy.a" ;;
                  "bluray")     PATTERN="libbluray.a" ;;
                  
                  # AI / Special libraries
                  "whisper")    PATTERN="libwhisper.a" ;; 
                  *)            PATTERN="lib${comp}.a" ;; 
              esac
              
              check_lib "$comp" "$f" "$PATTERN"
          done

      - name: Package Artifacts
        if: success()
        run: |
          # Set permissions
          chmod -R 755 build/out/bin/
          export LD_LIBRARY_PATH="$(pwd)/build/out/lib:$(pwd)/build/out/lib64:$LD_LIBRARY_PATH"
          
          # Extract Version from binary
          RAW_VERSION=$(./build/out/bin/ffmpeg -version | head -n1 | awk '{print $3}')
          FFMPEG_VERSION=$(echo "$RAW_VERSION" | sed 's/-MiKayule.*//')
          echo "$FFMPEG_VERSION" > build/ffmpeg_version.txt
          
          # Rename Tarball
          NEW_TAR_NAME="ffmpeg-${FFMPEG_VERSION}-linux-x86_64-gcc.tar.gz"
          mv build/ffmpeg-build*.tar.gz "build/${NEW_TAR_NAME}"

      - name: Upload Linux Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: |
            build/ffmpeg-*.tar.gz
            build/ffmpeg_version.txt
            build/components.md
          if-no-files-found: error

      - name: Upload Logs (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-linux
          path: build/log/
          if-no-files-found: ignore


  # ============================================================================
  # Job 2: macOS Build Task
  # ============================================================================
  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-26  # User defined runner version
    
    steps:
      # --- 1. Checkout Code ---
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # --- 2. Install Dependencies ---
      - name: Install System Dependencies
        run: |
          brew update
          brew install automake libtool cmake ninja nasm pkg-config ccache wget xz

      # --- 3. Rust Environment ---
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-

      - name: Install cargo-c
        run: |
          set +e
          SKIP_INSTALL="false"

          # Check if cargo-cbuild exists and matches version
          if command -v cargo-cbuild >/dev/null 2>&1; then
            CURRENT_VERSION=$(cargo cbuild --version 2>/dev/null)
            if [[ "$CURRENT_VERSION" == *"${{ env.CARGO_C_VERSION }}"* ]]; then
              echo "✅ cargo-c v${{ env.CARGO_C_VERSION }} is already installed."
              SKIP_INSTALL="true"
            fi
          fi
          set -e
          
          if [ "$SKIP_INSTALL" != "true" ]; then
            echo "🚀 Installing cargo-c v${{ env.CARGO_C_VERSION }}..."
            cargo install cargo-c --version ${{ env.CARGO_C_VERSION }} --locked --force
          fi

      # --- 4. CCache Setup ---
      - name: Restore CCache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # --- 5. Main Build Execution ---
      - name: Run Build Script
        run: |
          # Configure CCache for macOS (Brew path)
          export PATH="$(brew --prefix ccache)/libexec:$PATH"
          ccache -M 500M
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          
          echo "==== CCache Status (Before) ===="
          ccache -s
          
          # Execution
          chmod +x build.sh build_fix.sh script/*.sh
          mkdir -p build && cd build
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES
          
          echo "==== CCache Status (After) ===="
          ccache -s

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}

      # --- 6. Verification & Artifact Prep ---
      - name: Package Artifacts
        if: success()
        run: |
          chmod -R 755 build/out/bin/
          export DYLD_LIBRARY_PATH="$(pwd)/build/out/lib:$(pwd)/build/out/lib64:$DYLD_LIBRARY_PATH"
          
          RAW_VERSION=$(./build/out/bin/ffmpeg -version | head -n1 | awk '{print $3}')
          FFMPEG_VERSION=$(echo "$RAW_VERSION" | sed 's/-MiKayule.*//')
          
          NEW_ZIP_NAME="ffmpeg-${FFMPEG_VERSION}-macos-arm64-clang.zip"
          mv build/ffmpeg-build*.zip "build/${NEW_ZIP_NAME}"

      - name: Upload macOS Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-archive
          path: build/ffmpeg-*.zip
          if-no-files-found: error

      - name: Upload Logs (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-macos
          path: build/log/
          if-no-files-found: ignore


  # ============================================================================
  # Job 3: Create Release
  # ============================================================================
  create-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [build-linux, build-macos]
    
    steps:
      - name: Checkout (Sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: version

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Notes
        run: |
          # 1. Read Version
          FFMPEG_VERSION=$(cat artifacts/linux-archive/ffmpeg_version.txt)
          echo "FFMPEG_VERSION=$FFMPEG_VERSION" >> $GITHUB_ENV
          
          # 2. Read Component List
          COMPONENTS_LIST=$(cat artifacts/linux-archive/components.md)

          # 3. Timestamps
          export TZ='Asia/Shanghai'
          CURRENT_TIME=$(date +'%Y-%m-%dT%H:%M:%S+08:00')
          
          # 4. Write Notes
          NOTES_FILE="release_notes.md"
          echo "### ~~最新最热的 FFmpeg~~" > $NOTES_FILE
          echo "编译于 \`${CURRENT_TIME}\`。视频编码库均选用最新的 commit，其余库使用的则是最新的 release。" >> $NOTES_FILE
          echo "其中 x265, SVT-AV1, VVenC, VVdeC 编译开启了 LTO 优化和 PGO 优化，FFmpeg 开启了 LTO 优化。" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "Compiled on \`${CURRENT_TIME}\`. Video encoding libraries use the latest commit, while other libraries use the latest release." >> $NOTES_FILE
          echo "x265, SVT-AV1, VVenC, and VVdeC are compiled with LTO and PGO enabled. FFmpeg is compiled with LTO enabled." >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "$COMPONENTS_LIST" >> $NOTES_FILE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FFMPEG_VERSION }}-${{ github.run_number }}
          name: FFmpeg Build ${{ env.FFMPEG_VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/linux-archive/*.tar.gz
            artifacts/macos-archive/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
