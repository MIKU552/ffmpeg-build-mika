name: FFmpeg Multi-Platform CI

on: 
  push:
    branches: [ "MIX" ]
  pull_request:
    branches: [ "MIX" ]
  workflow_dispatch: 

env:
  CARGO_C_VERSION: "0.10.20" # 全局统一管理 cargo-c 版本

jobs:
  # ==========================================
  # Job 1: Linux 编译任务
  # ==========================================
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ binutils make cmake ninja-build pkg-config \
            curl wget patch tar gzip bzip2 xz-utils zip python3 python3-pip \
            python3-venv python3-virtualenv nasm git-lfs docbook-utils \
            xsltproc asciidoc xmlto gperf autopoint automake libtool autoconf \
            gettext liblzma-dev libnuma-dev libssl-dev ccache \
            libva-dev libdrm-dev vulkan-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-

      - name: Install cargo-c
        run: |
          set +e
          HAS_CARGO_C=$(command -v cargo-cbuild)
          if [ -n "$HAS_CARGO_C" ]; then
            CURRENT_VERSION=$(cargo cbuild --version 2>/dev/null)
            if [[ "$CURRENT_VERSION" == *"${{ env.CARGO_C_VERSION }}"* ]]; then
              echo "cargo-c v${{ env.CARGO_C_VERSION }} is already installed from cache, skipping!"
              SKIP_INSTALL="true"
            fi
          fi
          set -e
          
          if [ "$SKIP_INSTALL" != "true" ]; then
            echo "Installing/Updating cargo-c to v${{ env.CARGO_C_VERSION }}..."
            cargo install cargo-c --version ${{ env.CARGO_C_VERSION }} --locked --force
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Run Build Script
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 2G
          chmod +x build.sh build_fix.sh script/*.sh
          mkdir -p build && cd build
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}

      - name: Prepare Linux Artifact
        if: success()
        run: |
          chmod -R 755 build/out/bin/
          export LD_LIBRARY_PATH="$(pwd)/build/out/lib:$(pwd)/build/out/lib64:$LD_LIBRARY_PATH"
          
          # 提取版本号并存入文本文件，供最后的 Release 任务读取
          RAW_VERSION=$(./build/out/bin/ffmpeg -version | head -n1 | awk '{print $3}')
          FFMPEG_VERSION=$(echo "$RAW_VERSION" | sed 's/-MiKayule.*//')
          echo "$FFMPEG_VERSION" > build/ffmpeg_version.txt
          
          NEW_TAR_NAME="ffmpeg-${FFMPEG_VERSION}-linux-x86_64-gcc.tar.gz"
          mv build/ffmpeg-build*.tar.gz "build/${NEW_TAR_NAME}"

      - name: Upload Linux Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: |
            build/ffmpeg-*.tar.gz
            build/ffmpeg_version.txt
          if-no-files-found: error

      - name: Upload Linux Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-linux
          path: build/log/
          if-no-files-found: ignore


  # ==========================================
  # Job 2: macOS 编译任务
  # ==========================================
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies
        run: |
          brew update
          brew install automake libtool cmake ninja nasm pkg-config ccache wget xz

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-

      - name: Install cargo-c
        run: |
          set +e
          HAS_CARGO_C=$(command -v cargo-cbuild)
          if [ -n "$HAS_CARGO_C" ]; then
            CURRENT_VERSION=$(cargo cbuild --version 2>/dev/null)
            if [[ "$CURRENT_VERSION" == *"${{ env.CARGO_C_VERSION }}"* ]]; then
              echo "cargo-c v${{ env.CARGO_C_VERSION }} is already installed from cache, skipping!"
              SKIP_INSTALL="true"
            fi
          fi
          set -e
          
          if [ "$SKIP_INSTALL" != "true" ]; then
            echo "Installing/Updating cargo-c to v${{ env.CARGO_C_VERSION }}..."
            cargo install cargo-c --version ${{ env.CARGO_C_VERSION }} --locked --force
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Run Build Script
        run: |
          export PATH="$(brew --prefix ccache)/libexec:$PATH"
          ccache -M 2G
          chmod +x build.sh build_fix.sh script/*.sh
          mkdir -p build && cd build
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}

      - name: Prepare macOS Artifact
        if: success()
        run: |
          chmod -R 755 build/out/bin/
          export DYLD_LIBRARY_PATH="$(pwd)/build/out/lib:$(pwd)/build/out/lib64:$DYLD_LIBRARY_PATH"
          
          RAW_VERSION=$(./build/out/bin/ffmpeg -version | head -n1 | awk '{print $3}')
          FFMPEG_VERSION=$(echo "$RAW_VERSION" | sed 's/-MiKayule.*//')
          
          NEW_ZIP_NAME="ffmpeg-${FFMPEG_VERSION}-macos-arm64-clang.zip"
          mv build/ffmpeg-build*.zip "build/${NEW_ZIP_NAME}"

      - name: Upload macOS Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-archive
          path: build/ffmpeg-*.zip
          if-no-files-found: error

      - name: Upload macOS Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-macos
          path: build/log/
          if-no-files-found: ignore


  # ==========================================
  # Job 3: 汇总生成 Release (依赖前两个任务成功)
  # ==========================================
  create-release:
    runs-on: ubuntu-24.04
    needs: [build-linux, build-macos] # 必须等 Linux 和 macOS 都编译完成才会启动
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: version # 只需要检出 version 目录用来生成列表，提高速度

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # 下载后的结构会是 artifacts/linux-archive/... 和 artifacts/macos-archive/...

      - name: Generate Release Notes and Version
        run: |
          # 1. 从 Linux 任务传过来的文本中读取版本号
          FFMPEG_VERSION=$(cat artifacts/linux-archive/ffmpeg_version.txt)
          echo "FFMPEG_VERSION=$FFMPEG_VERSION" >> $GITHUB_ENV
          
          # 2. 准备时间戳
          export TZ='Asia/Shanghai'
          CURRENT_TIME=$(date +'%Y-%m-%dT%H:%M:%S+08:00')
          
          # 3. 生成双语 Release Notes
          NOTES_FILE="release_notes.md"
          
          echo "### ~~最新最热的 FFmpeg~~" > $NOTES_FILE
          echo "编译于 \`${CURRENT_TIME}\`。视频编码库均选用最新的 commit，其余库使用的则是最新的 release。" >> $NOTES_FILE
          echo "其中 x265, SVT-AV1, VVenC, VVdeC 编译开启了 LTO 优化和 PGO 优化，FFmpeg 开启了 LTO 优化 (注: macOS 暂未开启 PGO)。" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          echo "Compiled on \`${CURRENT_TIME}\`. Video encoding libraries use the latest commit, while other libraries use the latest release." >> $NOTES_FILE
          echo "x265, SVT-AV1, VVenC, and VVdeC are compiled with LTO and PGO enabled. FFmpeg is compiled with LTO enabled (Note: PGO is disabled on macOS)." >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          echo "### Compiled Component Versions" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          
          # 遍历 version 目录
          for f in $(ls version/* | sort); do
              if [ -f "$f" ]; then
                  comp=$(basename "$f")
                  if [ "$comp" = "ffmpeg" ]; then
                      continue
                  fi
                  ver=$(cat "$f")
                  echo "* **$comp**: \`$ver\`" >> $NOTES_FILE
              fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FFMPEG_VERSION }}-${{ github.run_number }}
          name: FFmpeg Build ${{ env.FFMPEG_VERSION }}
          body_path: release_notes.md
          # 抓取两大平台所有的打包文件并挂载
          files: |
            artifacts/linux-archive/*.tar.gz
            artifacts/macos-archive/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}