name: FFmpeg Build Windows CI

on: 
  push:
    branches: [ "MIXWINDOWSCI" ]
  workflow_dispatch: 

env:
  CARGO_C_VERSION: "0.10.20"
  # 统一 ccache 目录到当前工作区
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # 【终极修复】强制统一 Cargo 的家目录到当前工作区，防止 MSYS2 和 Windows 路径分叉！
  CARGO_HOME: ${{ github.workspace }}/.cargo

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # 安装所需的所有原生工具链和 autotools 家族
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkgconf
            gperf
            gettext
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-rust

      - name: Restore Cargo Cache
        uses: actions/cache/restore@v4
        with:
          # 直接使用相对路径读取当前工作区下的 .cargo 文件夹
          path: |
            .cargo/bin/
            .cargo/registry/index/
            .cargo/registry/cache/
            .cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-

      - name: Install cargo-c
        shell: msys2 {0}
        run: |
          # 【关键】把工作区的 Cargo bin 目录挂载到 MSYS2 系统的 PATH 最前面
          export PATH="${{ github.workspace }}/.cargo/bin:$PATH"
          
          set +e
          HAS_CARGO_C=$(command -v cargo-cbuild)
          if [ -n "$HAS_CARGO_C" ]; then
            CURRENT_VERSION=$(cargo cbuild --version 2>/dev/null)
            if [[ "$CURRENT_VERSION" == *"${{ env.CARGO_C_VERSION }}"* ]]; then
              echo "cargo-c v${{ env.CARGO_C_VERSION }} is already installed from cache, skipping!"
              SKIP_INSTALL="true"
            fi
          fi
          set -e
          
          if [ "$SKIP_INSTALL" != "true" ]; then
            echo "Installing/Updating cargo-c to v${{ env.CARGO_C_VERSION }}..."
            cargo install cargo-c --version ${{ env.CARGO_C_VERSION }} --locked --force
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Run Build Script
        shell: msys2 {0}
        run: |
          # 挂载 ccache 和刚才自定义的 cargo 路径
          export PATH="/mingw64/lib/ccache/bin:$PATH"
          export PATH="${{ github.workspace }}/.cargo/bin:$PATH"
          ccache -M 2G
          
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          
          chmod +x build.sh build_fix.sh script/*.sh
          mkdir -p build && cd build
          ../build_fix.sh -SKIP_BUNDLE=NO -SKIP_TEST=YES

      - name: Save Cargo Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cargo/bin/
            .cargo/registry/index/
            .cargo/registry/cache/
            .cargo/git/db/
          key: ${{ runner.os }}-cargo-c-${{ env.CARGO_C_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}-${{ github.run_attempt }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs-windows
          path: build/log/
          if-no-files-found: ignore

      - name: Prepare Windows Artifact
        shell: msys2 {0}
        if: success()
        run: |
          chmod -R 755 build/out/bin/
          
          RAW_VERSION=$(./build/out/bin/ffmpeg.exe -version | head -n1 | awk '{print $3}')
          FFMPEG_VERSION=$(echo "$RAW_VERSION" | sed 's/-MiKayule.*//')
          
          NEW_ZIP_NAME="ffmpeg-${FFMPEG_VERSION}-windows-x86_64-mingw.zip"
          mv build/ffmpeg-build*.zip "build/${NEW_ZIP_NAME}"
          
          echo "ZIP_NAME=${NEW_ZIP_NAME}" >> $GITHUB_ENV
          echo "FFMPEG_VERSION=$FFMPEG_VERSION" >> $GITHUB_ENV

          export TZ='Asia/Shanghai'
          CURRENT_TIME=$(date +'%Y-%m-%dT%H:%M:%S+08:00')
          NOTES_FILE="release_notes.md"
          
          echo "### ~~最新最热的 FFmpeg~~" > $NOTES_FILE
          echo "编译于 \`${CURRENT_TIME}\`。这是 Windows 专属全量纯静态编译版 (.exe)。" >> $NOTES_FILE
          echo "已集成 NVIDIA (NVENC/NVDEC)、AMD (AMF) 和 Intel (QSV/VPL) 全平台硬件加速！" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "### Compiled Component Versions" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          for f in $(ls version/* | sort); do
              if [ -f "$f" ]; then
                  comp=$(basename "$f")
                  if [ "$comp" = "ffmpeg" ]; then continue; fi
                  ver=$(cat "$f")
                  echo "* **$comp**: \`$ver\`" >> $NOTES_FILE
              fi
          done

      - name: Upload Windows Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: build/ffmpeg-*.zip
          if-no-files-found: error

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FFMPEG_VERSION }}-${{ github.run_number }}-windows
          name: FFmpeg Windows Build ${{ env.FFMPEG_VERSION }}
          body_path: release_notes.md
          files: build/${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}